[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-iot-device-monitor"
version = "0.1.0"
description = "Subscribe to AWS IoT Core telemetry and alerts and print messages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "awscrt>=0.20",
    "awsiotsdk>=1.21",
    "boto3>=1.34",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
device-monitor = "device_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
