[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-iot-device-simulator"
version = "0.1.0"
description = "Provision an AWS IoT Core Thing and replay stored telemetry."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "awsiotsdk>=1.20",
    "boto3>=1.34",
    "pandas>=2.1,<4",
    "pyarrow>=14,<27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
device-simulator = "device_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
